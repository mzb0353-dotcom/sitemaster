    function Icon({ name, className = 'w-4 h-4' }) {
      return (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
          {(ICONS[name] || []).map((d, i) => {
            if (d.startsWith('c:')) {
              const [cx, cy, r] = d.slice(2).split(',');
              return <circle key={i} cx={cx} cy={cy} r={r} />;
            }
            if (d.startsWith('r:')) {
              const [x, y, w, h] = d.slice(2).split(',');
              return <rect key={i} x={x} y={y} width={w} height={h} rx="1" />;
            }
            return <path key={i} d={d} />;
          })}
        </svg>
      );
    }

    const ROLE_LABELS = { manager: 'מנהל פרויקט', contractor: 'קבלן מבצע', architect: 'אדריכל' };
    const SEVERITY_LABELS = { high: 'קריטי', medium: 'בינוני', low: 'נמוך' };

    const fmtDate = (iso) => (iso ? iso.split('T')[0].split('-').reverse().join('/') : '');

    const explainError = (err) => {
      if (!err) return 'שגיאה לא ידועה';
      if (err.code === '23505') return 'כבר קיימת רשומה כזו (שם כפול).';
      if (err.code === '42501' || /row-level security/i.test(err.message || '')) return 'אין לך הרשאה לבצע פעולה זו.';
      return err.message || 'שגיאה לא צפויה';
    };

    const dataUrlToBlob = (dataUrl) => {
      const [meta, b64] = dataUrl.split(',');
      const mime = (meta.match(/:(.*?);/) || [])[1] || 'image/jpeg';
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i += 1) bytes[i] = bin.charCodeAt(i);
      return new Blob([bytes], { type: mime });
    };

    const compressImage = (file, maxSize = 1280, quality = 0.75) =>
      new Promise((resolve, reject) => {
        if (!file.type.startsWith('image/')) return reject(new Error('not an image'));
        const reader = new FileReader();
        reader.onerror = reject;
        reader.onload = () => {
          const img = new Image();
          img.onerror = reject;
          img.onload = () => {
            const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
            const canvas = document.createElement('canvas');
            canvas.width = Math.round(img.width * scale);
            canvas.height = Math.round(img.height * scale);
            canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });

    /* ============================================================
       שכבת נתונים
       ============================================================ */
    async function getSignedUrls(bucket, paths, expiresIn = 3600) {
      const unique = [...new Set((paths || []).filter(Boolean))];
      if (!unique.length) return {};
      const { data, error } = await sb.storage.from(bucket).createSignedUrls(unique, expiresIn);
      if (error) throw error;
      const map = {};
      data.forEach((it) => { if (!it.error && it.signedUrl) map[it.path] = it.signedUrl; });
      return map;
    }

    async function uploadDefectPhoto(defectId, kind, dataUrl) {
      const path = `${defectId}/${kind}-${Date.now()}.jpg`;
      const { error } = await sb.storage.from('defects').upload(path, dataUrlToBlob(dataUrl), { contentType: 'image/jpeg', upsert: false });
      if (error) throw error;
      return path;
    }

    async function loadWorkspace() {
      const [projects, rooms, defects, contractors] = await Promise.all([
        sb.from('projects').select('*').order('created_at', { ascending: false }),
        sb.from('rooms').select('*, systems(*)').order('created_at'),
        sb.from('defects').select('*, approver:profiles!approved_by(full_name)').order('created_at', { ascending: false }),
        sb.from('profiles').select('id, full_name, company, phone').eq('role', 'contractor').order('full_name')
      ]);
      [projects, rooms, defects, contractors].forEach((r) => { if (r.error) throw r.error; });

      const urls = await getSignedUrls('defects', defects.data.flatMap((d) => [d.before_image_path, d.after_image_path]));

      return {
        projects: projects.data.map((p) => ({
          id: p.id, name: p.name, address: p.address || '', client: p.client_name || '',
          phone: p.client_phone || '', startDate: fmtDate(p.start_date), status: p.status || ''
        })),
        rooms: rooms.data.map((r) => ({
          id: r.id, projectId: r.project_id, name: r.name,
          systems: (r.systems || []).map((s) => ({
            id: s.id, type: s.system_type, name: s.name, installer: s.installer_name || '',
            details: s.details || '', status: s.status || ''
          }))
        })),
        defects: defects.data.map((d) => ({
          id: d.id, projectId: d.project_id, roomId: d.room_id, room: d.room_name, system: d.system_type,
          title: d.title, description: d.description || '', severity: d.severity, status: d.status,
          contractorId: d.contractor_id, contractor: d.contractor_name || '',
          reportedDate: fmtDate(d.reported_date), fixedDate: fmtDate(d.fixed_date) || null,
          beforeImage: (d.before_image_path && urls[d.before_image_path]) || null,
          afterImage: (d.after_image_path && urls[d.after_image_path]) || null,
          fixNote: d.fix_note || '', approvedBy: (d.approver && d.approver.full_name) || null
        })),
        contractors: contractors.data.map((c) => ({ id: c.id, name: c.full_name, company: c.company || '', phone: c.phone || '' }))
      };
    }

    async function createProject(f) {
      const { data, error } = await sb.from('projects').insert({
        name: f.name.trim(), address: f.address.trim() || null,
        client_name: f.client.trim() || null, client_phone: f.phone.trim() || null
      }).select('id').single();
      if (error) throw error;
      return data.id;
    }

    async function createRoom(projectId, name) {
      const { error } = await sb.from('rooms').insert({ project_id: projectId, name: name.trim() });
      if (error) throw error;
    }

    async function deleteRoom(id) {
      const { error } = await sb.from('rooms').delete().eq('id', id);
      if (error) throw error;
    }

    async function updateDefect(id, patch) {
      const { data, error } = await sb.from('defects').update(patch).eq('id', id).select('id');
      if (error) throw error;
      if (!data || !data.length) throw new Error('הפעולה לא בוצעה: אין הרשאה, או שהליקוי השתנה בינתיים. רענן ונסה שוב.');
    }

    async function createDefect(f) {
      const id = crypto.randomUUID();
      let beforePath = null;
      if (f.imageDataUrl) beforePath = await uploadDefectPhoto(id, 'before', f.imageDataUrl);
      const { error } = await sb.from('defects').insert({
        id, project_id: f.projectId, room_id: f.roomId, room_name: f.roomName, system_type: f.system,
        title: f.title.trim(), description: f.description.trim() || 'אין פירוט נוסף', severity: f.severity,
        contractor_id: f.contractorId, contractor_name: f.contractorName, before_image_path: beforePath
      });
      if (error) {
        if (beforePath) await sb.storage.from('defects').remove([beforePath]).catch(() => {});
        throw error;
      }
    }

    async function reportFix(defectId, note, afterDataUrl) {
      const afterPath = await uploadDefectPhoto(defectId, 'after', afterDataUrl);
      try {
        await updateDefect(defectId, { status: 'pending', fix_note: note.trim() || 'בוצע תיקון. מוגש לאישור מנהל.', after_image_path: afterPath });
      } catch (err) {
        await sb.storage.from('defects').remove([afterPath]).catch(() => {});
        throw err;
      }
    }

    const approveDefect = (id) => updateDefect(id, { status: 'closed' });
    const rejectDefect = (id, reason, managerName) =>
      updateDefect(id, { status: 'open', fix_note: `נדחה ע"י ${managerName}: ${reason}`, after_image_path: null, fixed_date: null });

    function Modal({ title, onClose, children }) {
      return (
        <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">

              <button type="button" onClick={onClose} className="text-slate-400 hover:text-white" aria-label="סגור">
                <Icon name="x" className="w-5 h-5" />
              </button>
            </div>
            {children}
          </div>
        </div>
      );

    function Field({ label, children }) {
      return (
        <div>
          <label className="block text-slate-400 mb-1 text-xs">{label}</label>
          {children}
        </div>
      );
    }

    function Spinner({ className = 'w-5 h-5 text-amber-500' }) {
      return <Icon name="loader" className={`${className} animate-spin`} />;
    }

    function FullScreenLoader() {
      return <div className="min-h-screen flex items-center justify-center"><Spinner className="w-8 h-8 text-amber-500" /></div>;
    }

    function PhotoPicker({ value, onChange, label }) {
      const [busy, setBusy] = useState(false);
      const [error, setError] = useState('');
      const handleFile = async (e) => {
        const file = e.target.files && e.target.files[0];
        e.target.value = '';
        if (!file) return;
        setBusy(true);
        setError('');
        try { onChange(await compressImage(file)); } catch { setError('לא ניתן לקרוא את הקובץ. נסה תמונה אחרת.'); } finally { setBusy(false); }
      };
      const tile = 'flex flex-col items-center gap-1.5 p-3 bg-slate-900/60 rounded-xl border border-dashed border-slate-700 hover:border-amber-500 cursor-pointer text-xs text-slate-300';
      return (
        <div className="space-y-1.5">
          {label && <span className="block text-xs text-slate-400">{label}</span>}
          {value ? (
            <div className="relative w-full h-40 rounded-xl overflow-hidden border border-slate-700">
              <img src={value} alt="תצוגה מקדימה" className="w-full h-full object-cover" />
              <button type="button" onClick={() => onChange(null)} className="absolute top-2 left-2 bg-black/70 text-white p-1.5 rounded-full" aria-label="הסר תמונה">
                <Icon name="x" />
              </button>
            </div>
          ) : (
            <div className="grid grid-cols-2 gap-2">
              <label className={tile}><Icon name="camera" className="w-5 h-5 text-amber-400" /><span>{busy ? 'מעבד...' : 'צלם עכשיו'}</span>
                <input type="file" accept="image/*" capture="environment" onChange={handleFile} className="hidden" /></label>
              <label className={tile}><Icon name="layers" className="w-5 h-5 text-amber-400" /><span>{busy ? 'מעבד...' : 'בחר מהגלריה'}</span>
                <input type="file" accept="image/*" onChange={handleFile} className="hidden" /></label>
            </div>
          )}
          {error && <p className="text-xs text-red-400">{error}</p>}
        </div>
      );
    }

    function Thumb({ src, title, tone, emptyText, onOpen }) {
      const tones = { red: ['text-rose-400', 'border-rose-500/40'], green: ['text-emerald-400', 'border-emerald-500/40'] };
      const [textCls, borderCls] = tones[tone];
      return (
        <div>
          <span className={`text-[10px] font-bold block mb-1 ${textCls}`}>{title}</span>
          {src ? (
            <button type="button" onClick={onOpen} className={`group w-24 h-24 sm:w-28 sm:h-28 rounded-xl overflow-hidden border relative block ${borderCls}`}>

            </div>

    /* ============================================================
       מסך כניסה
       ============================================================ */
    function LoginScreen() {
      const [email, setEmail] = useState('');
      const [sending, setSending] = useState(false);
      const [sentTo, setSentTo] = useState('');
      const [error, setError] = useState('');

      const submit = async (e) => {
        e.preventDefault();
        if (!email.trim()) return;
        setSending(true);
        setError('');
        const { error: err } = await sb.auth.signInWithOtp({
          email: email.trim(),
          options: { shouldCreateUser: false, emailRedirectTo: window.location.origin + window.location.pathname }
        });
        setSending(false);
        if (err) {
          setError(/rate|seconds/i.test(err.message) ? 'נשלחו יותר מדי בקשות. המתן דקה ונסה שוב.' : 'לא ניתן לשלוח קישור. ודא שהאימייל מוזמן למערכת, או פנה למנהל.');
          return;
        }
        setSentTo(email.trim());
      };

      return (
        <div className="min-h-screen text-slate-100 flex items-center justify-center p-4">
          <div className="w-full max-w-sm bg-slate-800/80 border border-slate-700 rounded-2xl p-6 space-y-5 shadow-xl">
            <div className="flex items-center gap-3">
              <div className="bg-amber-500 text-slate-950 p-2 rounded-xl"><Icon name="hat" className="w-6 h-6" /></div>
              <div>
                <span className="font-black text-lg tracking-wider text-white">SITEMASTER</span>
                <span className="text-amber-400 font-bold text-xs mr-1">PRO</span>
                <p className="text-[10px] text-slate-400 -mt-1">כניסה למערכת</p>
              </div>
            </div>
            {sentTo ? (
              <div className="space-y-3">
                <div className="flex items-center gap-2 text-emerald-400 font-bold text-sm"><Icon name="mail" className="w-5 h-5" />הקישור נשלח</div>
                <p className="text-slate-300 text-xs leading-relaxed">
                  שלחנו קישור כניסה אל <span dir="ltr" className="font-bold text-white">{sentTo}</span>. פתח אותו בדפדפן הרגיל של הטלפון (Chrome או Safari). אם לא הגיע, בדוק בספאם.
                </p>
                <button type="button" onClick={() => setSentTo('')} className="text-xs text-amber-400 hover:underline">שלח שוב או החלף אימייל</button>
              </div>
            ) : (
              <form onSubmit={submit} className="space-y-3">
                <Field label="אימייל">
                  <input type="email" required autoFocus dir="ltr" value={email}
                    onChange={(e) => { setEmail(e.target.value); setError(''); }}
                    placeholder="name@example.com" className={`${INPUT} text-left`} />
                </Field>
                {error && <p className="text-red-400 text-xs">{error}</p>}
                <button type="submit" disabled={sending} className={`${BTN} w-full py-2.5`}>
                  {sending && <Spinner className="w-4 h-4" />}שלח לי קישור כניסה
                </button>
                <p className="text-[11px] text-slate-500">הכניסה למוזמנים בלבד. אין צורך בסיסמה.</p>
              </form>
            )}
          </div>
        </div>
      );
    }

    function BlueprintsTab({ projectId, userRole }) {
      const [items, setItems] = useState([]);
      const [urls, setUrls] = useState({});
      const [loading, setLoading] = useState(true);
      const [loadError, setLoadError] = useState('');
      const [showUpload, setShowUpload] = useState(false);
      const [uploading, setUploading] = useState(false);
      const [uploadError, setUploadError] = useState('');
      const [file, setFile] = useState(null);
      const [title, setTitle] = useState('');
      const [discipline, setDiscipline] = useState(DISCIPLINES[0]);
      const [version, setVersion] = useState('גרסה 1');
      const canUpload = userRole === 'manager' || userRole === 'architect';

      const load = useCallback(async () => {
        const { data, error } = await sb.from('blueprints').select('*').eq('project_id', projectId).order('created_at', { ascending: false });
        if (error) throw error;
        return { rows: data || [], map: await getSignedUrls('blueprints', (data || []).map((b) => b.file_path)) };
      }, [projectId]);

      useEffect(() => {
        let cancelled = false;
        setLoading(true); setLoadError(''); setItems([]);
        load().then(({ rows, map }) => { if (!cancelled) { setItems(rows); setUrls(map); } })
          .catch(() => { if (!cancelled) setLoadError('שגיאה בטעינת תוכניות הפרויקט'); })
          .finally(() => { if (!cancelled) setLoading(false); });
        return () => { cancelled = true; };
      }, [load]);

      const closeModal = () => {
        if (uploading) return;
        setShowUpload(false); setFile(null); setTitle(''); setVersion('גרסה 1'); setUploadError('');
      };

      const upload = async (e) => {
        e.preventDefault();
        if (!file || !title.trim()) return;
        const ext = BLUEPRINT_TYPES[file.type];
        if (!ext) { setUploadError('אפשר להעלות רק PDF, JPG או PNG.'); return; }
        if (file.size > 50 * 1024 * 1024) { setUploadError('הקובץ גדול מ-50MB.'); return; }
        setUploading(true); setUploadError('');
        let path = null;
        try {
          path = `${projectId}/${crypto.randomUUID()}.${ext}`;
          const up = await sb.storage.from('blueprints').upload(path, file, { contentType: file.type, upsert: false });
          if (up.error) throw up.error;
          const { error } = await sb.from('blueprints').insert({
            project_id: projectId, title: title.trim(), discipline, version: version.trim() || 'גרסה 1', file_path: path, file_name: file.name
          });
          if (error) throw error;
          const { rows, map } = await load();
          setItems(rows); setUrls(map); setUploading(false);
          setShowUpload(false); setFile(null); setTitle(''); setVersion('גרסה 1');
        } catch (err) {
          if (path) await sb.storage.from('blueprints').remove([path]).catch(() => {});
          setUploadError(explainError(err)); setUploading(false);
        }
      };

      const download = async (bp) => {
        const { data, error } = await sb.storage.from('blueprints').createSignedUrl(bp.file_path, 3600, { download: bp.file_name || true });
        if (error) { setLoadError('שגיאה בהפקת קישור הורדה'); return; }
        window.location.href = data.signedUrl;
      };

      return (
        <div className="space-y-4">
          <div className="bg-slate-800/60 p-4 rounded-xl border border-slate-700/60 flex items-center justify-between gap-3">
            <div>
              <h3 className="text-sm font-bold text-white">תוכניות ושרטוטי עבודה</h3>
              <p className="text-xs text-slate-400">אדריכלות, קונסטרוקציה ותשתיות לפי תחום</p>
            </div>
            {canUpload && <button type="button" onClick={() => setShowUpload(true)} className={BTN}><Icon name="upload" />העלה תוכנית</button>}
          </div>
          {loadError && <div className="p-3 bg-red-500/10 border border-red-500/20 text-red-400 text-xs rounded-xl">{loadError}</div>}
          {loading ? <div className="py-12 flex justify-center"><Spinner /></div> : items.length === 0 ? (
            <div className="py-12 text-center text-slate-400 bg-slate-900/40 rounded-2xl border border-dashed border-slate-800">
              <Icon name="file" className="w-8 h-8 text-slate-600 mx-auto mb-2" />
              <p className="font-bold text-sm text-slate-300">טרם הועלו תוכניות לפרויקט זה</p>
            </div>
          ) : (
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              {items.map((bp) => (
                <div key={bp.id} className="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
                  <div>
                    <div className="flex items-center justify-between mb-1">
                      <span className="text-[10px] px-2 py-0.5 rounded-full bg-slate-800 text-amber-400">{bp.discipline}</span>
                      <span className="text-[10px] text-slate-500">{bp.version}</span>
                    </div>
                    <h4 className="font-bold text-white text-sm">{bp.title}</h4>
                    <p className="text-[11px] text-slate-400 mt-0.5 truncate">{bp.file_name || 'קובץ תוכנית'}</p>
                  </div>
                  <div className="pt-2 border-t border-slate-800 flex items-center justify-between gap-2">
                    <span className="text-[10px] text-slate-500">{new Date(bp.created_at).toLocaleDateString('he-IL')}</span>
                    <div className="flex items-center gap-1.5">
                      {urls[bp.file_path] && (
                        <a href={urls[bp.file_path]} target="_blank" rel="noopener noreferrer" className="flex items-center gap-1 px-3 py-1 bg-amber-500/10 text-amber-400 text-xs rounded-lg">
                          <Icon name="eye" className="w-3.5 h-3.5" />צפייה
                        </a>
                      )}
                      <button type="button" onClick={() => download(bp)} className="flex items-center gap-1 px-3 py-1 bg-slate-800 text-slate-200 text-xs rounded-lg">
                        <Icon name="download" className="w-3.5 h-3.5" />הורדה
                      </button>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          )}
          {showUpload && (
            <Modal title="העלאת תוכנית עבודה" onClose={closeModal}>
              <form onSubmit={upload} className="space-y-3">
                <Field label="כותרת התוכנית *"><input required value={title} onChange={(e) => setTitle(e.target.value)} placeholder="למשל: תוכנית אינסטלציה קומה א׳" className={INPUT} /></Field>
                <div className="grid grid-cols-2 gap-2">
                  <Field label="תחום"><select value={discipline} onChange={(e) => setDiscipline(e.target.value)} className={INPUT}>{DISCIPLINES.map((d) => <option key={d} value={d}>{d}</option>)}</select></Field>
                  <Field label="גרסה"><input value={version} onChange={(e) => setVersion(e.target.value)} className={INPUT} /></Field>
                </div>
                <Field label="קובץ (PDF, JPG, PNG עד 50MB) *">
                  <input type="file" required accept="application/pdf,image/jpeg,image/png" onChange={(e) => setFile((e.target.files && e.target.files[0]) || null)} className={`${INPUT} p-2`} />
                </Field>
                {uploadError && <div className="p-2.5 bg-red-500/10 border border-red-500/20 text-red-400 rounded-lg text-xs">{uploadError}</div>}
                <div className="flex justify-end gap-2 pt-3 border-t border-slate-800">
                  <button type="button" disabled={uploading} onClick={closeModal} className={GHOST}>ביטול</button>
                  <button type="submit" disabled={uploading || !file || !title.trim()} className={BTN}>{uploading && <Spinner className="w-4 h-4" />}{uploading ? 'מעלה...' : 'העלה קובץ'}</button>
                </div>
              </form>
            </Modal>
          )}
        </div>
      );
    }

    /* ============================================================
       סביבת העבודה
       ============================================================ */
    const emptyDefectForm = () => ({ title: '', room: '', system: 'plumbing', contractorId: '', severity: 'medium', description: '', image: null });
    const roomStatusClass = (s) =>
      s === 'מאושר ביצוע' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20'
        : s === 'הותקן בשטח' ? 'bg-blue-500/10 text-blue-400 border border-blue-500/20'
        : 'bg-amber-500/10 text-amber-400 border border-amber-500/20';

    function Workspace({ profile }) {
      const isManager = profile.role === 'manager';
      const isContractor = profile.role === 'contractor';

      const [data, setData] = useState({ projects: [], rooms: [], defects: [], contractors: [] });
      const [loading, setLoading] = useState(true);
      const [loadError, setLoadError] = useState('');
      const [banner, setBanner] = useState('');
      const [busy, setBusy] = useState(false);
      const [projectId, setProjectId] = useState(null);
      const [tab, setTab] = useState('defects');
      const [fSystem, setFSystem] = useState('all');
      const [fStatus, setFStatus] = useState('all');
      const [query, setQuery] = useState('');
      const [modal, setModal] = useState(null); // 'defect' | 'project' | 'room'
      const [inspect, setInspect] = useState(null);
      const [form, setForm] = useState(emptyDefectForm);
      const [projForm, setProjForm] = useState({ name: '', address: '', client: '', phone: '' });
      const [roomName, setRoomName] = useState('');
      const [roomError, setRoomError] = useState('');
      const [fixId, setFixId] = useState(null);
      const [fixPhoto, setFixPhoto] = useState(null);
      const [fixText, setFixText] = useState('');

      const reload = useCallback(async () => {
        const ws = await loadWorkspace();
        setData(ws);
        setProjectId((prev) => (ws.projects.some((p) => p.id === prev) ? prev : (ws.projects[0] && ws.projects[0].id) || null));
      }, []);

      useEffect(() => {
        let cancelled = false;
        reload().catch((e) => { if (!cancelled) setLoadError(explainError(e)); }).finally(() => { if (!cancelled) setLoading(false); });
        return () => { cancelled = true; };
      }, [reload]);

      const run = async (fn) => {
        setBusy(true); setBanner('');
        try { await fn(); await reload(); return true; }
        catch (e) { setBanner(explainError(e)); return false; }
        finally { setBusy(false); }
      };

      const { projects, rooms, defects, contractors } = data;
      const project = useMemo(() => projects.find((p) => p.id === projectId) || null, [projects, projectId]);
      const projRooms = useMemo(() => (project ? rooms.filter((r) => r.projectId === project.id) : []), [rooms, project]);
      const projDefects = useMemo(() => (project ? defects.filter((d) => d.projectId === project.id) : []), [defects, project]);
      const sysStats = useMemo(() => {
        const all = projRooms.flatMap((r) => r.systems);
        return { total: all.length, approved: all.filter((s) => s.status === 'מאושר ביצוע').length };
      }, [projRooms]);
      const counts = useMemo(() => ({
        total: projDefects.length,
        open: projDefects.filter((d) => d.status === 'open').length,
        pending: projDefects.filter((d) => d.status === 'pending').length
      }), [projDefects]);
      const shown = useMemo(() => {
        const q = query.trim().toLowerCase();
        return projDefects.filter((d) => {
          if (fSystem !== 'all' && d.system !== fSystem) return false;
          if (fStatus !== 'all' && d.status !== fStatus) return false;
          return !q || [d.title, d.room, d.contractor, d.description].some((t) => t.toLowerCase().includes(q));
        });
      }, [projDefects, fSystem, fStatus, query]);
      const formRoom = projRooms.some((r) => r.name === form.room) ? form.room : (projRooms[0] && projRooms[0].name) || '';
      const openByContractor = useMemo(() => {
        const m = {};
        defects.forEach((d) => { if (d.status === 'open' && d.contractorId) m[d.contractorId] = (m[d.contractorId] || 0) + 1; });
        return m;
      }, [defects]);

      const changeProject = (id) => { setProjectId(id); setForm(emptyDefectForm()); };

      const submitProject = async (e) => {
        e.preventDefault();
        if (!projForm.name.trim()) return;
        let newId = null;
        const ok = await run(async () => { newId = await createProject(projForm); });
        if (ok) {
          setProjectId(newId); setForm(emptyDefectForm()); setQuery(''); setFSystem('all'); setFStatus('all');
          setModal(null); setProjForm({ name: '', address: '', client: '', phone: '' });
        }
      };

      const closeRoom = () => { setModal(null); setRoomName(''); setRoomError(''); };
      const submitRoom = async (e) => {
        e.preventDefault();
        const name = roomName.trim();
        if (!name || !project) return;
        if (projRooms.some((r) => r.name === name)) { setRoomError('כבר קיים חדר בשם הזה בפרויקט.'); return; }
        if (await run(() => createRoom(project.id, name))) closeRoom();
      };
      const removeRoom = async (room) => {
        const linked = projDefects.filter((d) => d.roomId === room.id).length;
        const msg = linked ? `לחדר "${room.name}" משויכים ${linked} ליקויים. הם יישארו ברשימה, אבל החדר יימחק. להמשיך?` : `למחוק את החדר "${room.name}"?`;
        if (window.confirm(msg)) await run(() => deleteRoom(room.id));
      };

      const submitDefect = async (e) => {
        e.preventDefault();
        const room = projRooms.find((r) => r.name === formRoom);
        const c = contractors.find((x) => x.id === form.contractorId);
        if (!form.title.trim() || !room || !c || !project) return;
        const ok = await run(() => createDefect({
          projectId: project.id, roomId: room.id, roomName: room.name, system: form.system, title: form.title,
          description: form.description, severity: form.severity, contractorId: c.id,
          contractorName: c.company ? `${c.name} - ${c.company}` : c.name, imageDataUrl: form.image
        }));
        if (ok) { setModal(null); setForm(emptyDefectForm()); }
      };

      const closeFix = () => { if (busy) return; setFixId(null); setFixPhoto(null); setFixText(''); };
      const submitFix = async () => {
        if (!fixPhoto || !fixId) return;
        if (await run(() => reportFix(fixId, fixText, fixPhoto))) { setFixId(null); setFixPhoto(null); setFixText(''); }
      };
      const reject = (id) => {
        const reason = window.prompt('נא להזין סיבה לדחיית התיקון ובקשת ביצוע חוזר:');
        if (reason && reason.trim()) run(() => rejectDefect(id, reason.trim(), profile.full_name));
      };

      const tabCls = (t) => `px-3.5 py-2 rounded-xl flex items-center gap-1.5 font-medium text-xs transition-all ${tab === t ? 'bg-amber-500 text-slate-950 font-bold' : 'bg-slate-700/40 text-slate-300 hover:bg-slate-700'}`;
      const sevCls = { high: 'bg-rose-500/20 text-rose-400 border border-rose-500/30', medium: 'bg-amber-500/20 text-amber-400 border border-amber-500/30', low: 'bg-blue-500/20 text-blue-400 border border-blue-500/30' };

      return (
        <div className="min-h-screen text-slate-100">
          <header className="border-b border-slate-800 bg-slate-900/90 backdrop-blur sticky top-0 z-40">
            <div className="max-w-7xl mx-auto px-4 py-2 flex flex-wrap items-center justify-between gap-2">
              <div className="flex items-center gap-3">
                <div className="bg-amber-500 text-slate-950 p-2 rounded-xl"><Icon name="hat" className="w-6 h-6" /></div>
                <div>
                  <span className="font-black text-lg tracking-wider text-white">SITEMASTER</span>
                  <span className="text-amber-400 font-bold text-xs mr-1">PRO</span>
                </div>
              </div>
              <div className="flex items-center gap-2 flex-wrap">
                {busy && <Spinner className="w-4 h-4 text-amber-400" />}
                {projects.length > 0 && (
                  <div className="flex items-center gap-2 bg-slate-800 border border-slate-700/80 px-3 py-1.5 rounded-xl text-xs">
                    <Icon name="building" className="w-4 h-4 text-amber-400" />
                    <select value={projectId || ''} onChange={(e) => changeProject(e.target.value)} className="bg-transparent text-white font-medium focus:outline-none max-w-[9rem]">
                      {projects.map((p) => <option key={p.id} value={p.id} className="bg-slate-800">{p.name}</option>)}
                    </select>
                  </div>
                )}
                {isManager && (
                  <button type="button" onClick={() => setModal('project')} className="p-2 bg-slate-800 text-amber-400 border border-slate-700/80 rounded-xl" title="פרויקט חדש" aria-label="פרויקט חדש"><Icon name="plus" /></button>
                )}
                <div className="flex items-center gap-2 bg-slate-800 border border-slate-700/80 rounded-xl px-3 py-1.5 text-xs">
                  <div className="leading-tight"><div className="text-slate-100 font-medium">{profile.full_name}</div><div className="text-[10px] text-amber-400">{ROLE_LABELS[profile.role]}</div></div>
                  <button type="button" onClick={() => sb.auth.signOut()} className="text-slate-400 hover:text-white p-1" title="התנתק" aria-label="התנתק"><Icon name="logout" /></button>
                </div>
              </div>
            </div>
          </header>

          <div className="max-w-7xl mx-auto px-4 py-5 space-y-5">
            {banner && (
              <div className="p-3 bg-red-500/10 border border-red-500/30 text-red-300 text-xs rounded-xl flex items-start justify-between gap-3 no-print">
                <span>{banner}</span><button type="button" onClick={() => setBanner('')} aria-label="סגור הודעה"><Icon name="x" /></button>
              </div>
            )}

            {loading ? <div className="py-20 flex justify-center"><Spinner className="w-8 h-8 text-amber-500" /></div>
              : loadError ? (
                <div className="py-12 text-center bg-slate-800/40 rounded-2xl border border-dashed border-red-500/40">
                  <p className="text-sm text-red-300 px-4">{loadError}</p>
                  <button type="button" onClick={() => window.location.reload()} className="text-xs text-amber-400 mt-2">נסה שוב</button>
                </div>
              ) : !project ? (
                <div className="py-16 text-center bg-slate-800/40 rounded-2xl border border-dashed border-slate-700">
                  <Icon name="building" className="w-10 h-10 text-slate-600 mx-auto mb-2" />
                  <p className="font-bold text-slate-300">אין פרויקטים להצגה</p>
                  <p className="text-xs text-slate-500 mt-1">{isManager ? 'לחץ על + בסרגל העליון כדי ליצור פרויקט.' : 'המנהל צריך לשייך אותך לפרויקט.'}</p>
                </div>
              ) : (
                <>
                  <div className="bg-slate-800/80 rounded-2xl border border-slate-700 p-4 shadow-xl no-print">
                    <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
                      <div className="space-y-1">
                        <div className="flex items-center gap-2">
                          <span className="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">{project.status}</span>
                          <span className="text-xs text-slate-400">התחלה: {project.startDate}</span>
                        </div>
                        <h1 className="text-xl font-bold text-white">{project.name}</h1>
                        <p className="text-xs text-slate-400">{project.address}{project.client && ` • ${project.client}`}{project.phone && ` (${project.phone})`}</p>
                      </div>
                      <div className="grid grid-cols-3 gap-2">
                        {[['ליקויים פתוחים', counts.open, 'text-rose-400'], ['לאישור מנהל', counts.pending, 'text-amber-400'],
                          ['מערכות מאושרות', sysStats.total ? `${sysStats.approved}/${sysStats.total}` : '—', 'text-emerald-400']].map(([l, v, c]) => (
                          <div key={l} className="bg-slate-900/60 p-2.5 rounded-xl border border-slate-700/50 text-center min-w-[80px]">
                            <span className="text-[10px] text-slate-400 block">{l}</span><span className={`text-lg font-black ${c}`}>{v}</span>
                          </div>
                        ))}
                      </div>
                    </div>
                    <div className="mt-4 pt-3 border-t border-slate-700/50 flex flex-wrap gap-2">
                      <button type="button" onClick={() => setTab('defects')} className={tabCls('defects')}><Icon name="alert" />ליקויים ({counts.total})</button>
                      <button type="button" onClick={() => setTab('rooms')} className={tabCls('rooms')}><Icon name="layers" />חדרים ותשתיות</button>
                      <button type="button" onClick={() => setTab('blueprints')} className={tabCls('blueprints')}><Icon name="file" />תוכניות</button>
                      {isManager && <button type="button" onClick={() => setTab('contractors')} className={tabCls('contractors')}><Icon name="user" />קבלנים</button>}
                      <button type="button" onClick={() => setTab('report')} className={tabCls('report')}><Icon name="printer" />דוח</button>
                    </div>
                  </div>

                  {tab === 'defects' && (
                    <div className="space-y-4">
                      <div className="bg-slate-800/60 p-3 rounded-xl border border-slate-700/60 flex flex-col md:flex-row gap-3 md:items-center justify-between">
                        <div className="flex flex-wrap items-center gap-2 flex-1">
                          <div className="relative flex-1 min-w-[180px]">
                            <span className="absolute right-3 top-2.5 text-slate-400"><Icon name="search" /></span>
                            <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder="חיפוש לפי כותרת, חדר או קבלן..." className="w-full bg-slate-900 border border-slate-700 rounded-lg pr-9 pl-3 py-1.5 text-xs text-white focus:outline-none focus:border-amber-500" />
                          </div>
                          <select value={fSystem} onChange={(e) => setFSystem(e.target.value)} className="bg-slate-900 border border-slate-700 rounded-lg px-2 py-1.5 text-xs text-slate-300">
                            <option value="all">כל המערכות</option><option value="plumbing">אינסטלציה</option><option value="electrical">חשמל</option><option value="hvac">מיזוג אוויר</option>
                          </select>
                          <select value={fStatus} onChange={(e) => setFStatus(e.target.value)} className="bg-slate-900 border border-slate-700 rounded-lg px-2 py-1.5 text-xs text-slate-300">
                            <option value="all">כל הסטטוסים</option><option value="open">פתוח</option><option value="pending">ממתין לאישור</option><option value="closed">סגור</option>
                          </select>
                        </div>
                        {isManager && <button type="button" onClick={() => setModal('defect')} className={BTN}><Icon name="plus" />פתיחת ליקוי חדש</button>}
                      </div>

                      {shown.length === 0 && (
                        <div className="py-14 text-center bg-slate-800/40 rounded-2xl border border-dashed border-slate-700">
                          <Icon name="ok" className="w-10 h-10 text-slate-600 mx-auto mb-2" />
                          <p className="font-bold text-slate-300">לא נמצאו ליקויים</p>
                          <p className="text-xs text-slate-500 mt-1">{isContractor ? 'לא שויכו אליך ליקויים בפרויקט זה.' : 'שנה את הסינון או פתח ליקוי חדש.'}</p>
                        </div>
                      )}

                      {shown.map((d) => (
                        <div key={d.id} className="bg-slate-800/90 rounded-2xl border border-slate-700/80 p-4 shadow-lg space-y-4">
                          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b border-slate-700/60 pb-3">
                            <div>
                              <div className="flex items-center gap-2 flex-wrap">
                                <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${sevCls[d.severity]}`}>{SEVERITY_LABELS[d.severity]}</span>
                                <span className="text-xs font-semibold text-slate-300">{d.room}</span><span className="text-slate-600">•</span>
                                <span className="text-xs text-slate-400">קבלן: {d.contractor}</span>
                              </div>
                              <h3 className="text-base font-bold text-white mt-1">{d.title}</h3>
                              <p className="text-xs text-slate-300 mt-1">{d.description}</p>
                            </div>
                            {d.status === 'open' && <span className="px-3 py-1 rounded-full text-xs font-bold bg-rose-500/10 text-rose-400 border border-rose-500/30 flex items-center gap-1 self-start"><Icon name="clock" className="w-3.5 h-3.5" />פתוח לביצוע</span>}
                            {d.status === 'pending' && <span className="px-3 py-1 rounded-full text-xs font-bold bg-amber-500/10 text-amber-400 border border-amber-500/30 flex items-center gap-1 self-start"><Icon name="alert" className="w-3.5 h-3.5" />ממתין לאישור מנהל</span>}
                            {d.status === 'closed' && <span className="px-3 py-1 rounded-full text-xs font-bold bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 flex items-center gap-1 self-start"><Icon name="ok" className="w-3.5 h-3.5" />סגור ומאושר</span>}
                          </div>

                          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                            <div className="flex items-center gap-3">
                              <Thumb src={d.beforeImage} title="לפני תיקון" tone="red" emptyText="לא צורפה תמונה" onOpen={() => setInspect({ src: d.beforeImage, label: 'לפני תיקון', def: d })} />
                              <Thumb src={d.afterImage} title="לאחר תיקון בשטח" tone="green" emptyText="טרם הועלתה תמונת ביצוע" onOpen={() => setInspect({ src: d.afterImage, label: 'לאחר תיקון בשטח', def: d })} />
                            </div>
                            {d.fixNote && (
                              <div className="bg-slate-900/70 p-3 rounded-xl border border-slate-700/80 text-xs text-slate-300 max-w-sm flex-1">
                                <span className="text-amber-400 font-bold block mb-0.5">הערת תיקון וביצוע:</span>{d.fixNote}
                                {d.fixedDate && <span className="text-[10px] text-slate-400 block mt-1">תאריך ביצוע: {d.fixedDate}</span>}
                              </div>
                            )}
                          </div>

                          <div className="pt-2 border-t border-slate-700/60 flex flex-wrap items-center justify-between gap-3 text-xs">
                            <div className="text-slate-400 text-[11px]">דווח: {d.reportedDate} {d.approvedBy && `• אושר סופית ע״י: ${d.approvedBy}`}</div>
                            <div className="flex items-center gap-2">
                              {isContractor && d.status === 'open' && (
                                <button type="button" disabled={busy} onClick={() => setFixId(d.id)} className="bg-blue-600 hover:bg-blue-500 disabled:opacity-50 text-white font-bold px-3.5 py-1.5 rounded-xl flex items-center gap-1.5"><Icon name="camera" />סמן כבוצע והעלה תמונה</button>
                              )}
                              {isManager && d.status === 'pending' && (
                                <>
                                  <button type="button" disabled={busy} onClick={() => reject(d.id)} className="bg-rose-500/20 disabled:opacity-50 text-rose-400 border border-rose-500/30 font-bold px-3 py-1.5 rounded-xl flex items-center gap-1"><Icon name="x" />דחה</button>
                                  <button type="button" disabled={busy} onClick={() => run(() => approveDefect(d.id))} className="bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 text-white font-bold px-4 py-1.5 rounded-xl flex items-center gap-1.5"><Icon name="check" />אשר וסגור</button>
                                </>
                              )}
                            </div>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}

                  {tab === 'rooms' && (
                    <div className="space-y-4">
                      <div className="bg-slate-800/60 p-4 rounded-xl border border-slate-700/60 flex items-center justify-between gap-3">
                        <div><h3 className="text-sm font-bold text-white">מיפוי מערכות לפי חדר</h3>
                          <p className="text-xs text-slate-400">מאושרות: <span className="text-emerald-400 font-bold">{sysStats.approved} מתוך {sysStats.total}</span></p></div>
                        {isManager && <button type="button" onClick={() => setModal('room')} className={BTN}><Icon name="plus" />הוסף חדר</button>}
                      </div>
                      {projRooms.length === 0 ? (
                        <div className="py-12 text-center bg-slate-800/40 rounded-2xl border border-dashed border-slate-700">
                          <p className="font-bold text-slate-300">טרם הוגדרו חדרים לפרויקט זה</p>
                          {isManager && <p className="text-xs text-slate-500 mt-1">לחץ על ״הוסף חדר״ כדי להתחיל.</p>}
                        </div>
                      ) : (
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                          {projRooms.map((room) => (
                            <div key={room.id} className="bg-slate-800 rounded-2xl border border-slate-700 p-4 space-y-3 shadow-lg">
                              <div className="flex items-center justify-between border-b border-slate-700 pb-2">
                                <h3 className="text-base font-bold text-white">{room.name}</h3>
                                {isManager && <button type="button" disabled={busy} onClick={() => removeRoom(room)} className="text-slate-500 hover:text-rose-400 p-1" title="מחק חדר" aria-label={`מחק את ${room.name}`}><Icon name="x" /></button>}
                              </div>
                              {room.systems.length === 0 && <p className="text-xs text-slate-500">עדיין לא הוגדרו מערכות בחדר זה.</p>}
                              {room.systems.map((s) => (
                                <div key={s.id} className="bg-slate-900/60 p-3 rounded-xl border border-slate-700/60 text-xs space-y-1">
                                  <div className="flex items-center justify-between"><span className="font-bold text-white">{s.name}</span><span className={`text-[10px] px-2 py-0.5 rounded-full ${roomStatusClass(s.status)}`}>{s.status}</span></div>
                                  <p className="text-slate-400">{s.details}</p>
                                  {s.installer && <p className="text-[11px] text-amber-400/90 pt-1">מתקין: {s.installer}</p>}
                                </div>
                              ))}
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  )}

                  {tab === 'blueprints' && <BlueprintsTab projectId={project.id} userRole={profile.role} />}

                  {tab === 'contractors' && isManager && (
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                      {contractors.length === 0 && <p className="text-xs text-slate-400 col-span-full">אין קבלנים רשומים. הזמן קבלנים דרך Supabase (Authentication → Users) ושייך אותם לפרויקט.</p>}
                      {contractors.map((c) => (
                        <div key={c.id} className="bg-slate-800 rounded-2xl border border-slate-700 p-4 space-y-3">
                          <div className="flex items-center gap-3">
                            <div className="w-10 h-10 rounded-xl bg-amber-500/10 border border-amber-500/20 text-amber-400 flex items-center justify-center font-bold">{c.name.charAt(0)}</div>
                            <div><h4 className="font-bold text-white text-sm">{c.name}</h4><p className="text-xs text-slate-400">{c.company}</p></div>
                          </div>
                          <div className="pt-2 border-t border-slate-700/60 text-xs space-y-1 text-slate-300">
                            <div className="flex justify-between"><span>ליקויים פתוחים:</span><span className="font-bold text-rose-400">{openByContractor[c.id] || 0}</span></div>
                            {c.phone && <div className="flex justify-between items-center"><span>טלפון:</span><a href={`tel:${c.phone}`} className="font-bold text-amber-400 flex items-center gap-1"><Icon name="phone" className="w-3 h-3" />{c.phone}</a></div>}
                          </div>
                          <button type="button" onClick={() => { setFSystem('all'); setFStatus('all'); setQuery(c.name); setTab('defects'); }} className="text-xs text-amber-400 font-bold">הצג ליקויים משויכים</button>
                        </div>
                      ))}
                    </div>
                  )}

                  {tab === 'report' && (
                    <div className="space-y-3">
                      <div className="max-w-4xl mx-auto flex justify-end no-print"><button type="button" onClick={() => window.print()} className={BTN}><Icon name="printer" />הדפס / שמור כ-PDF</button></div>
                      <div className="bg-white text-slate-900 rounded-2xl p-6 shadow-2xl max-w-4xl mx-auto space-y-5">
                        <div className="flex justify-between items-start border-b-2 border-slate-900 pb-4 gap-3">
                          <div><h2 className="text-xl font-black">פרוטוקול מסירה ובקרת ליקויים</h2><p className="text-xs text-slate-600 mt-1">מסמך בדיקה רשמי לקבלנים ומזמיני עבודה</p></div>
                          <div className="text-xs"><p><strong>פרויקט:</strong> {project.name}</p><p><strong>כתובת:</strong> {project.address}</p><p><strong>תאריך:</strong> {new Date().toLocaleDateString('en-GB')}</p></div>
                        </div>
                        <div className="overflow-x-auto">
                          <table className="w-full text-right text-xs border border-slate-300">
                            <thead className="bg-slate-100 border-b border-slate-300"><tr>{['חדר', 'ליקוי', 'קבלן', 'סטטוס', 'אישור מנהל'].map((h) => <th key={h} className="p-2 border-l border-slate-300">{h}</th>)}</tr></thead>
                            <tbody>
                              {projDefects.length === 0 && <tr><td colSpan={5} className="p-4 text-center text-slate-500">אין ליקויים רשומים בפרויקט זה</td></tr>}
                              {projDefects.map((d) => (
                                <tr key={d.id} className="border-b border-slate-200">
                                  <td className="p-2 border-l border-slate-200 font-bold">{d.room}</td><td className="p-2 border-l border-slate-200">{d.title}</td>
                                  <td className="p-2 border-l border-slate-200">{d.contractor}</td><td className="p-2 border-l border-slate-200">{STATUS_LABELS[d.status]}</td>
                                  <td className="p-2 font-medium">{d.approvedBy || 'טרם אושר'}</td>
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        </div>
                        <div className="pt-8 border-t border-slate-300 grid grid-cols-2 gap-8 text-xs text-center">
                          <div><div className="border-b border-slate-400 pb-8 mb-2"></div><p className="font-bold">חתימת מנהל הפרויקט</p></div>
                          <div><div className="border-b border-slate-400 pb-8 mb-2"></div><p className="font-bold">חתימת הקבלן המבצע</p></div>
                        </div>
                      </div>
                    </div>
                  )}
                </>
              )}
          </div>

          {modal === 'project' && (
            <Modal title="הקמת פרויקט חדש" onClose={() => setModal(null)}>
              <form onSubmit={submitProject} className="space-y-3">
                <Field label="שם הפרויקט *"><input required autoFocus value={projForm.name} onChange={(e) => setProjForm({ ...projForm, name: e.target.value })} placeholder="למשל: וילה נווה צדק" className={INPUT} /></Field>
                <Field label="כתובת"><input value={projForm.address} onChange={(e) => setProjForm({ ...projForm, address: e.target.value })} className={INPUT} /></Field>
                <div className="grid grid-cols-2 gap-2">
                  <Field label="שם הלקוח"><input value={projForm.client} onChange={(e) => setProjForm({ ...projForm, client: e.target.value })} className={INPUT} /></Field>
                  <Field label="טלפון"><input type="tel" value={projForm.phone} onChange={(e) => setProjForm({ ...projForm, phone: e.target.value })} className={INPUT} /></Field>
                </div>
                <div className="flex justify-end gap-2 pt-3 border-t border-slate-800"><button type="button" onClick={() => setModal(null)} className={GHOST}>ביטול</button><button type="submit" disabled={busy} className={BTN}>צור פרויקט</button></div>
              </form>
            </Modal>
          )}

          {modal === 'room' && (
            <Modal title={`הוספת חדר ל${(project && project.name) || ''}`} onClose={closeRoom}>
              <form onSubmit={submitRoom} className="space-y-3">
                <Field label="שם החדר / אזור *">
                  <input required autoFocus value={roomName} onChange={(e) => { setRoomName(e.target.value); setRoomError(''); }} placeholder="למשל: מרפסת שמש, חדר כביסה" className={INPUT} />
                  {roomError && <p className="text-red-400 text-xs mt-1">{roomError}</p>}
                </Field>
                <div className="flex justify-end gap-2 pt-3 border-t border-slate-800"><button type="button" onClick={closeRoom} className={GHOST}>ביטול</button><button type="submit" disabled={busy} className={BTN}>הוסף חדר</button></div>
              </form>
            </Modal>
          )}

          {modal === 'defect' && (
            <Modal title="פתיחת ליקוי שטח חדש" onClose={() => setModal(null)}>
              <form onSubmit={submitDefect} className="space-y-3">
                {projRooms.length === 0 ? (
                  <div className="p-3 bg-amber-500/10 border border-amber-500/20 rounded-lg text-amber-400 text-xs">לא הוגדרו חדרים לפרויקט זה. הוסף חדר בלשונית ״חדרים ותשתיות״ ונסה שוב.</div>
                ) : (
                  <Field label="חדר / מיקום"><select value={formRoom} onChange={(e) => setForm({ ...form, room: e.target.value })} className={INPUT}>{projRooms.map((r) => <option key={r.id} value={r.name}>{r.name}</option>)}</select></Field>
                )}
                <Field label="כותרת הליקוי"><input required value={form.title} onChange={(e) => setForm({ ...form, title: e.target.value })} placeholder="למשל: סדק באיטום, שקע לא מפולס..." className={INPUT} /></Field>
                <div className="grid grid-cols-2 gap-2">
                  <Field label="מערכת"><select value={form.system} onChange={(e) => setForm({ ...form, system: e.target.value })} className={INPUT}><option value="plumbing">אינסטלציה</option><option value="electrical">חשמל</option><option value="hvac">מיזוג אוויר</option></select></Field>
                  <Field label="חומרה"><select value={form.severity} onChange={(e) => setForm({ ...form, severity: e.target.value })} className={INPUT}><option value="low">נמוך</option><option value="medium">בינוני</option><option value="high">קריטי</option></select></Field>
                </div>
                <Field label="קבלן אחראי">
                  <select required value={form.contractorId} onChange={(e) => setForm({ ...form, contractorId: e.target.value })} className={INPUT}>
                    <option value="">בחר קבלן...</option>{contractors.map((c) => <option key={c.id} value={c.id}>{c.name}{c.company ? ` (${c.company})` : ''}</option>)}
                  </select>
                  {contractors.length === 0 && <p className="text-amber-400 text-xs mt-1">אין קבלנים רשומים. הזמן קבלן דרך Supabase.</p>}
                </Field>
                <Field label="תיאור מפורט"><textarea rows={2} value={form.description} onChange={(e) => setForm({ ...form, description: e.target.value })} className={`${INPUT} resize-none`} /></Field>
                <PhotoPicker value={form.image} onChange={(img) => setForm((p) => ({ ...p, image: img }))} label="תמונת הליקוי (אופציונלי)" />
                <div className="flex justify-end gap-2 pt-3 border-t border-slate-800">
                  <button type="button" onClick={() => setModal(null)} className={GHOST}>ביטול</button>
                  <button type="submit" disabled={busy || !projRooms.length || !contractors.length} className={BTN}>{busy && <Spinner className="w-4 h-4" />}צור ליקוי</button>
                </div>
              </form>
            </Modal>
          )}

          {fixId && (
            <Modal title="דיווח תיקון והגשה לאישור" onClose={closeFix}>
              <label className="block text-xs font-medium text-slate-300">תמונת הוכחת תיקון <span className="text-amber-400">* (חובה)</span></label>
              <PhotoPicker value={fixPhoto} onChange={setFixPhoto} />
              <Field label="הערת קבלן / פעולות שבוצעו"><textarea rows={3} value={fixText} onChange={(e) => setFixText(e.target.value)} placeholder="למשל: נאטם בחומר ביטומני ונבדק תחת לחץ מים..." className={`${INPUT} resize-none`} /></Field>
              <div className="flex justify-end gap-2 pt-3 border-t border-slate-800">
                <button type="button" onClick={closeFix} disabled={busy} className={GHOST}>ביטול</button>
                <button type="button" disabled={!fixPhoto || busy} onClick={submitFix} className={BTN}>{busy && <Spinner className="w-4 h-4" />}הגש לאישור מנהל</button>
              </div>
            </Modal>
          )}

          {inspect && (
            <div onClick={() => setInspect(null)} className="fixed inset-0 bg-black/85 backdrop-blur-sm z-50 flex items-center justify-center p-4 cursor-pointer">
              <div onClick={(e) => e.stopPropagation()} className="relative max-w-2xl w-full bg-slate-900 border border-slate-800 rounded-2xl p-4 text-center cursor-default shadow-2xl">
                <button type="button" onClick={() => setInspect(null)} className="absolute top-3 left-3 z-10 bg-slate-900/80 text-slate-300 p-1 rounded-lg" aria-label="סגור תמונה"><Icon name="x" className="w-5 h-5" /></button>
                <img src={inspect.src} alt={inspect.label} className="max-h-[75vh] w-auto mx-auto rounded-xl object-contain" />
                <div className="flex flex-wrap items-center justify-center gap-x-4 gap-y-1 text-xs text-slate-400 mt-4 border-t border-slate-800/80 pt-3">
                  <span className="font-semibold text-slate-200">{inspect.label}</span><span>•</span><span>דווח: {inspect.def.reportedDate}</span>
                  {inspect.def.fixedDate && <><span>•</span><span className="text-emerald-400">תוקן: {inspect.def.fixedDate}</span></>}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    /* ============================================================
       שער התחברות
       ============================================================ */
    function App() {
      const [session, setSession] = useState(undefined);
      const [profile, setProfile] = useState(null);
      const [profileError, setProfileError] = useState('');

      useEffect(() => {
        sb.auth.getSession().then(({ data }) => setSession(data.session)).catch(() => setSession(null));
        const { data } = sb.auth.onAuthStateChange((_event, s) => setSession(s));
        return () => data.subscription.unsubscribe();
      }, []);

      const userId = session && session.user && session.user.id;

      useEffect(() => {
        setProfile(null); setProfileError('');
        if (!userId) return undefined;
        let cancelled = false;
        sb.from('profiles').select('id, full_name, role, company, phone').eq('id', userId).single()
          .then(({ data, error }) => {
            if (cancelled) return;
            if (error) setProfileError('לא ניתן לטעון את הפרופיל שלך. ייתכן שהחשבון עדיין לא הוגדר, פנה למנהל.');
            else setProfile(data);
          });
        return () => { cancelled = true; };
      }, [userId]);

      if (session === undefined) return <FullScreenLoader />;
      if (!session) return <LoginScreen />;
      if (profileError) {
        return (
          <div className="min-h-screen text-slate-100 flex flex-col items-center justify-center gap-3 p-4 text-center">
            <p className="text-sm text-red-400 max-w-sm">{profileError}</p>
            <button type="button" onClick={() => sb.auth.signOut()} className="text-xs text-amber-400">התנתק</button>
          </div>
        );
      }
      if (!profile) return <FullScreenLoader />;
      return <Workspace profile={profile} />;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
